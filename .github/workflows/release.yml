name: Release

# Publishes @venqoo/brand to the public npm registry when a tag like `v0.1.0`
# is pushed. Uses npm trusted publishing (OIDC): register this repository and
# this workflow file as a trusted publisher for @venqoo/brand on npmjs.com once,
# and no NPM_TOKEN secret is needed. The very first version has to be published
# by hand, because npm only lets you configure a trusted publisher for a
# package that already exists.
#
#   pnpm version patch                     # bumps package.json and creates the tag
#   git push --follow-tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PKG_VERSION" = "$TAG_VERSION" || { echo "tag $TAG_VERSION != package $PKG_VERSION"; exit 1; }
      - name: Publish
        run: npm publish --access public --provenance
